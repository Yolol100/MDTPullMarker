name: Validate source

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Compile Lua files
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.lua' -print0 | while IFS= read -r -d '' file; do
            LUA_FILE="$file" lua5.1 -e 'local f,e=loadfile(os.getenv("LUA_FILE")); assert(f,e)'
          done
      - name: Verify TOC files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r entry; do
            case "$entry" in ''|'##'*|'#'*) continue ;; esac
            entry="${entry//\\//}"
            test -f "$entry" || { echo "Missing TOC file: $entry" >&2; exit 1; }
          done < MDTPullMarker.toc
      - name: Verify retired modules stay unloaded and inert
        shell: bash
        run: |
          set -euo pipefail
          for retired_toc in 'Runtime\PullController.lua' 'Integrations\MDTUI.lua' 'UI\Configuration.lua'; do
            if grep -Fq "$retired_toc" MDTPullMarker.toc; then
              echo "Retired module returned to the active TOC: $retired_toc" >&2
              exit 1
            fi
          done
          for retired_file in 'Runtime/PullController.lua' 'Integrations/MDTUI.lua' 'UI/Configuration.lua'; do
            if test -f "$retired_file" && grep -Ev '^[[:space:]]*(--.*)?$' "$retired_file" | grep -q .; then
              echo "Retired placeholder contains executable/non-comment content: $retired_file" >&2
              exit 1
            fi
          done
          grep -Fq 'Runtime\RuntimeController.lua' MDTPullMarker.toc
          grep -Fq 'Integrations\MDTIntegration.lua' MDTPullMarker.toc
          grep -Fq 'UI\ConfigurationUI.lua' MDTPullMarker.toc

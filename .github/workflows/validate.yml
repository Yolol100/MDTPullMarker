name: Validate source

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Lua validation tooling
        shell: bash
        run: |
          set -euo pipefail
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' /etc/apt/apt-mirrors.txt
          fi
          apt_opts=(
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=20
            -o Acquire::https::Timeout=20
          )
          sudo apt-get "${apt_opts[@]}" update
          sudo apt-get "${apt_opts[@]}" install -y lua5.1 lua-check
      - name: Audit complete repository
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/audit_repository.py scripts/audit_midnight_apis.py scripts/check_upstream_drift.py scripts/build_release.py
          python3 scripts/audit_repository.py
          python3 scripts/audit_midnight_apis.py
          python3 scripts/check_upstream_drift.py --validate-only
          git diff --check
      - name: Compile Lua files
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.lua' -print0 | while IFS= read -r -d '' file; do
            LUA_FILE="$file" lua5.1 -e 'local f,e=loadfile(os.getenv("LUA_FILE")); assert(f,e)'
          done
      - name: Luacheck runtime files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t runtime_files < <(awk 'NF && $1 !~ /^#/ { gsub(/\\/, "/"); if ($0 ~ /\.lua$/) print $0 }' MDTPullMarker.toc)
          test "${#runtime_files[@]}" -gt 0
          luacheck --codes "${runtime_files[@]}"
      - name: Verify TOC files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r entry; do
            case "$entry" in ''|'##'*|'#'*) continue ;; esac
            entry="${entry//\\//}"
            test -f "$entry" || { echo "Missing TOC file: $entry" >&2; exit 1; }
          done < MDTPullMarker.toc
      - name: Verify retired duplicate modules stay deleted
        shell: bash
        run: |
          set -euo pipefail
          for retired_file in 'Runtime/PullController.lua' 'Integrations/MDTUI.lua' 'UI/Configuration.lua'; do
            if test -e "$retired_file"; then
              echo "Retired duplicate source path returned: $retired_file" >&2
              exit 1
            fi
          done
          grep -Fq 'Runtime\RuntimeController.lua' MDTPullMarker.toc
          grep -Fq 'Integrations\MDTIntegration.lua' MDTPullMarker.toc
          grep -Fq 'UI\ConfigurationUI.lua' MDTPullMarker.toc
      - name: Verify deterministic CurseForge package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/a dist/b
          python3 scripts/build_release.py dist/a/MDTPullMarker.zip > dist/a/SHA256SUMS.txt
          python3 scripts/build_release.py dist/b/MDTPullMarker.zip > dist/b/SHA256SUMS.txt
          cmp -s dist/a/MDTPullMarker.zip dist/b/MDTPullMarker.zip
          test "$(sha256sum dist/a/MDTPullMarker.zip | cut -d' ' -f1)" = "$(cut -d' ' -f1 dist/a/SHA256SUMS.txt)"

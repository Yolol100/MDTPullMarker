name: Validate source

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Compile Lua files
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.lua' -print0 | while IFS= read -r -d '' file; do
            LUA_FILE="$file" lua5.1 -e 'local f,e=loadfile(os.getenv("LUA_FILE")); assert(f,e)'
          done
      - name: Verify TOC files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r entry; do
            case "$entry" in ''|'##'*|'#'*) continue ;; esac
            entry="${entry//\\//}"
            test -f "$entry" || { echo "Missing TOC file: $entry" >&2; exit 1; }
          done < MDTPullMarker.toc
      - name: Verify retired modules stay unloaded
        shell: bash
        run: |
          set -euo pipefail
          for retired in 'Runtime\PullController.lua' 'Integrations\MDTUI.lua' 'UI\Configuration.lua'; do
            if grep -Fq "$retired" MDTPullMarker.toc; then
              echo "Retired module returned to the active TOC: $retired" >&2
              exit 1
            fi
          done
          grep -Fq 'Runtime\RuntimeController.lua' MDTPullMarker.toc
          grep -Fq 'Integrations\MDTIntegration.lua' MDTPullMarker.toc
          grep -Fq 'UI\ConfigurationUI.lua' MDTPullMarker.toc

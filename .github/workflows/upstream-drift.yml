name: Check upstream drift

on:
  schedule:
    - cron: "23 5 * * *"
    - cron: "23 17 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream-drift:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare audited MDT baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check_upstream_drift.py --online

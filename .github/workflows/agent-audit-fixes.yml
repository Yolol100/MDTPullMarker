name: Validate MDT Pull Marker audit fixes

on:
  push:
    branches:
      - agent/audit-fixes-20260816
    paths:
      - '.github/workflows/agent-audit-fixes.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/audit-fixes-20260816
      - run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Compile and regress
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.lua' -print0 | while IFS= read -r -d '' file; do
            LUA_FILE="$file" lua5.1 -e 'local f,e=loadfile(os.getenv("LUA_FILE")); assert(f,e)'
          done
          while IFS= read -r entry; do
            case "$entry" in ''|'##'*|'#'*) continue ;; esac
            entry="${entry//\\//}"
            test -f "$entry" || { echo "Missing TOC file: $entry" >&2; exit 1; }
          done < MDTPullMarker.toc
          lua5.1 tests/run.lua
          git diff --check

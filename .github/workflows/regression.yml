name: Focused regressions

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Run focused Lua 5.1 regressions
        run: lua5.1 tests/run.lua

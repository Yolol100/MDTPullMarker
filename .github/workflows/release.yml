name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: mdtpullmarker-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Verify tag matches TOC version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^## Version:[[:space:]]*//p' MDTPullMarker.toc | head -n1 | tr -d '\r')"
          test -n "$VERSION"
          test "$GITHUB_REF_NAME" = "v$VERSION" || {
            echo "Tag $GITHUB_REF_NAME does not match TOC version $VERSION" >&2
            exit 1
          }

      - name: Re-run source and regression gates
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/audit_repository.py scripts/build_release.py
          python3 scripts/audit_repository.py
          lua5.1 tests/run.lua
          find . -type f -name '*.lua' -print0 | while IFS= read -r -d '' file; do
            LUA_FILE="$file" lua5.1 -e 'local f,e=loadfile(os.getenv("LUA_FILE")); assert(f,e)'
          done
          git diff --check

      - name: Build deterministic release archive
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^## Version:[[:space:]]*//p' MDTPullMarker.toc | head -n1 | tr -d '\r')"
          mkdir -p dist/round1 dist/round2
          python3 scripts/build_release.py "dist/round1/MDTPullMarker-${VERSION}.zip" >/dev/null
          python3 scripts/build_release.py "dist/round2/MDTPullMarker-${VERSION}.zip" >/dev/null
          cmp -s "dist/round1/MDTPullMarker-${VERSION}.zip" "dist/round2/MDTPullMarker-${VERSION}.zip"
          mv "dist/round1/MDTPullMarker-${VERSION}.zip" "dist/MDTPullMarker-${VERSION}.zip"
          rm -rf dist/round1 dist/round2
          (cd dist && sha256sum "MDTPullMarker-${VERSION}.zip" > SHA256SUMS.txt)
          (cd dist && sha256sum -c SHA256SUMS.txt)

      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: dist/*

      - name: Create draft GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^## Version:[[:space:]]*//p' MDTPullMarker.toc | head -n1 | tr -d '\r')"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to mutate its release assets." >&2
            exit 1
          fi
          args=(
            gh release create "$GITHUB_REF_NAME"
            "dist/MDTPullMarker-${VERSION}.zip"
            "dist/SHA256SUMS.txt"
            --verify-tag
            --title "MDT Pull Marker ${VERSION}"
            --generate-notes
            --draft
          )
          if [[ "$VERSION" == *-* ]]; then
            args+=(--prerelease)
          fi
          "${args[@]}"
          echo 'Draft release created. Publish only after the documented live Retail acceptance gate passes.'

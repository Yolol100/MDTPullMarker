name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: mdtpullmarker-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Lua validation tooling
        shell: bash
        run: |
          set -euo pipefail
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' /etc/apt/apt-mirrors.txt
          fi
          apt_opts=(
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=20
            -o Acquire::https::Timeout=20
          )
          sudo apt-get "${apt_opts[@]}" update
          sudo apt-get "${apt_opts[@]}" install -y lua5.1 lua-check

      - name: Verify tag matches TOC version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^## Version:[[:space:]]*//p' MDTPullMarker.toc | head -n1 | tr -d '\r')"
          test -n "$VERSION"
          test "$GITHUB_REF_NAME" = "v$VERSION" || {
            echo "Tag $GITHUB_REF_NAME does not match TOC version $VERSION" >&2
            exit 1
          }

      - name: Re-run source and regression gates
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/audit_repository.py scripts/audit_midnight_apis.py scripts/test_audit_midnight_apis.py scripts/audit_addon_network.py scripts/check_upstream_drift.py scripts/build_release.py scripts/build_sbom.py
          python3 scripts/audit_repository.py
          python3 scripts/test_audit_midnight_apis.py
          python3 scripts/audit_midnight_apis.py
          python3 scripts/audit_addon_network.py
          python3 scripts/check_upstream_drift.py --validate-only
          lua5.1 tests/run.lua
          find . -type f -name '*.lua' -print0 | while IFS= read -r -d '' file; do
            LUA_FILE="$file" lua5.1 -e 'local f,e=loadfile(os.getenv("LUA_FILE")); assert(f,e)'
          done
          mapfile -t runtime_files < <(awk 'NF && $1 !~ /^#/ { gsub(/\\/, "/"); if ($0 ~ /\.lua$/) print $0 }' MDTPullMarker.toc)
          test "${#runtime_files[@]}" -gt 0
          luacheck --codes "${runtime_files[@]}"
          git diff --check

      - name: Build deterministic release archive and SPDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^## Version:[[:space:]]*//p' MDTPullMarker.toc | head -n1 | tr -d '\r')"
          mkdir -p dist/round1 dist/round2
          python3 scripts/build_release.py "dist/round1/MDTPullMarker-${VERSION}.zip" >/dev/null
          python3 scripts/build_sbom.py --archive "dist/round1/MDTPullMarker-${VERSION}.zip" --output dist/round1/SBOM.spdx.json
          python3 scripts/build_release.py "dist/round2/MDTPullMarker-${VERSION}.zip" >/dev/null
          python3 scripts/build_sbom.py --archive "dist/round2/MDTPullMarker-${VERSION}.zip" --output dist/round2/SBOM.spdx.json
          cmp -s "dist/round1/MDTPullMarker-${VERSION}.zip" "dist/round2/MDTPullMarker-${VERSION}.zip"
          cmp -s dist/round1/SBOM.spdx.json dist/round2/SBOM.spdx.json
          mv "dist/round1/MDTPullMarker-${VERSION}.zip" "dist/MDTPullMarker-${VERSION}.zip"
          mv dist/round1/SBOM.spdx.json dist/SBOM.spdx.json
          rm -rf dist/round1 dist/round2
          (cd dist && sha256sum "MDTPullMarker-${VERSION}.zip" SBOM.spdx.json > SHA256SUMS.txt)
          (cd dist && sha256sum -c SHA256SUMS.txt)

      - name: Upload exact validated release payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mdtpullmarker-release-${{ github.sha }}
          path: |
            dist/MDTPullMarker-*.zip
            dist/SHA256SUMS.txt
            dist/SBOM.spdx.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  attest-release:
    needs: validate-release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download exact validated release payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mdtpullmarker-release-${{ github.sha }}
          path: dist

      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/MDTPullMarker-*.zip
            dist/SHA256SUMS.txt
            dist/SBOM.spdx.json

      - name: Attest release ZIP with SPDX SBOM predicate
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/MDTPullMarker-*.zip
          sbom-path: dist/SBOM.spdx.json

  draft-release:
    needs: [validate-release, attest-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      attestations: read
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download attested release payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mdtpullmarker-release-${{ github.sha }}
          path: dist

      - name: Verify release checksums and attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^## Version:[[:space:]]*//p' MDTPullMarker.toc | head -n1 | tr -d '\r')"
          test "$GITHUB_REF_NAME" = "v$VERSION"
          (cd dist && sha256sum -c SHA256SUMS.txt)
          gh attestation verify "dist/MDTPullMarker-${VERSION}.zip" --repo "$GITHUB_REPOSITORY"
          gh attestation verify "dist/MDTPullMarker-${VERSION}.zip" --repo "$GITHUB_REPOSITORY" --predicate-type https://spdx.dev/Document/v2.3

      - name: Create draft GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^## Version:[[:space:]]*//p' MDTPullMarker.toc | head -n1 | tr -d '\r')"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to mutate its release assets." >&2
            exit 1
          fi
          args=(
            gh release create "$GITHUB_REF_NAME"
            "dist/MDTPullMarker-${VERSION}.zip"
            "dist/SHA256SUMS.txt"
            "dist/SBOM.spdx.json"
            --verify-tag
            --title "MDT Pull Marker ${VERSION}"
            --generate-notes
            --draft
          )
          if [[ "$VERSION" == *-* ]]; then
            args+=(--prerelease)
          fi
          "${args[@]}"
          echo 'Draft release created. Publish only after the documented live Retail acceptance gate passes.'

name: Final MDT Pull Marker completion fixes

on:
  push:
    branches:
      - agent/fix-all-completion

permissions:
  contents: write

jobs:
  fix-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/fix-all-completion
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Complete user-facing copy cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('UI/ConfigurationUI.lua'): {
                  'Bind an MDT route first, or enter the dungeon for legacy macro mode.': 'Bind an MDT route first, or enter the dungeon to use automatic marker macros.',
                  'Select the route you want in MDT, then click Bind route. Legacy mode still activates automatically in a dungeon.': 'Select the route you want in MDT, then click Bind route. Without a bound route, marker macros activate automatically in a dungeon.',
                  'Markers submitted • next marked pull loads after combat': 'Markers applied • next marked pull loads after combat',
                  'MDTPM1 submitted  ->  wait ~4 sec  ->  MDTPM2': 'Marker macro 1 applied  ->  wait ~4 sec  ->  marker macro 2',
                  'MDTPM1 submitted • next marked pull loads after combat': 'Marker macro 1 applied • next marked pull loads after combat',
                  'Same-name pull parked safely': 'Manual targeting required for this pull',
                  'Preparing macros...': 'Preparing marker macros...',
                  'Macros update after combat': 'Marker macros update after combat',
              },
              Path('UI/RuntimeFrame.lua'): {
                  'Marked pull needs attention in MDT': 'This pull needs attention in MDT',
                  'Same-name pull parked safely': 'Manual targeting required for this pull',
                  'Electing party marker owner...': 'Choosing who applies party markers...',
                  'Route macros refresh after combat': 'Route macros update after combat',
                  'Macros update after combat': 'Marker macros update after combat',
                  'Preparing macros...': 'Preparing marker macros...',
                  'MDTPM1 submitted • next marked pull loads after combat': 'Marker macro 1 applied • next marked pull loads after combat',
                  'Active/submitted pulls: ': 'Active/applied pulls: ',
              },
          }
          for path, mapping in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in mapping.items():
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          visible = '\n'.join(Path(p).read_text(encoding='utf-8') for p in [
              'Locale/enUS.lua', 'UI/ConfigurationUI.lua', 'UI/RuntimeFrame.lua'
          ])
          forbidden = [
              'Legacy mode',
              'legacy macro mode',
              'Markers submitted',
              'MDTPM1 submitted',
              'Active/submitted pulls',
              'Same-name pull parked safely',
              'Electing party marker owner...',
              'Marked pull needs attention in MDT',
              'Route macros refresh after combat',
          ]
          leftovers = [value for value in forbidden if value in visible]
          if leftovers:
              raise SystemExit('stale user-facing copy remains: ' + ', '.join(leftovers))
          PY
      - name: Compile Lua sources
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.lua' -print0 | while IFS= read -r -d '' file; do
            LUA_FILE="$file" lua5.1 -e 'local f,e=loadfile(os.getenv("LUA_FILE")); assert(f,e)'
          done
      - name: Run full regression suite
        shell: bash
        run: |
          set -euo pipefail
          lua5.1 tests/run.lua
          git diff --check
      - name: Commit verified product fixes and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/agent-fix-all-completion.yml
          git config user.name 'Yolol100'
          git config user.email 'Andrew_Baeten@hotmail.com'
          git add Locale/enUS.lua UI/ConfigurationUI.lua UI/RuntimeFrame.lua
          git diff --cached --check
          git commit -m 'Finish frontend copy cleanup'
          git push origin HEAD:refs/heads/agent/fix-all-completion

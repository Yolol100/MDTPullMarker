name: Apply MDT Pull Marker verified polish

on:
  push:
    branches: [agent/frontend-backend-polish]
    paths: ['.github/workflows/agent-polish-final.yml']

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontend-backend-polish
      - name: Apply existing-behavior polish
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def polish(path, replacements, minimum):
              p = Path(path); text = p.read_text(encoding='utf-8'); count = 0
              for old, new in replacements:
                  if old in text:
                      text = text.replace(old, new); count += 1
              if count < minimum:
                  raise SystemExit(f'{path}: only {count} polish anchors matched')
              p.write_text(text, encoding='utf-8')

          polish('Locale/enUS.lua', [
              ('Waiting for dungeon', 'Waiting for dungeon...'),
              ('Preparing macros...', 'Preparing marker macros...'),
              ('Macros update after combat', 'Marker macros update after combat'),
              ('Same-name pull parked safely', 'Manual targeting required for this pull'),
              ('Route macros refresh after combat', 'Route macros update after combat'),
              ('Marked pull needs attention in MDT', 'This pull needs attention in MDT'),
              ('Electing party marker owner...', 'Choosing who applies party markers...'),
          ], 7)
          polish('UI/ConfigurationUI.lua', [
              ('Route macros prepared and safely parked:', 'Route macros ready but inactive:'),
              ('Route macro repair waits until combat ends', 'Route macros update after combat'),
              ('This pull cannot be built safely. Check /mpm doctor.', 'This pull can’t be marked automatically. Run /mpm doctor for details.'),
              ('Marker plan is not ready. Check /mpm doctor.', 'Marker plan isn’t ready. Run /mpm doctor for details.'),
              ('Open MDT markers', 'Open MDT map'),
              ('Bind selected route', 'Bind route'),
              ('Pick current A', 'Pick up A macro'),
              ('Pick current B', 'Pick up B macro'),
              ('Pick current C', 'Pick up C macro'),
              ('Pick up MDTPM1', 'Pick up marker macro 1'),
              ('Pick up MDTPM2', 'Pick up marker macro 2'),
          ], 8)
          polish('UI/RuntimeFrame.lua', [
              ('Pull %s / %s', 'Pull %s of %s'),
              ('Passive - "..tostring(ownership.owner).." is marker owner', '"..tostring(ownership.owner).." is applying party markers'),
              ('Route macros parked until this dungeon/client is active', 'Route macros are ready but inactive for this dungeon'),
              ('This client stays idle to prevent duplicate party marking.', 'Pull Marker stays inactive here to prevent duplicate markers.'),
              ('Current pull markers submitted • overlap tracking active until combat ends', 'Current pull markers applied • tracking remains active until combat ends'),
              ('Markers submitted • next marked pull loads after combat', 'Markers applied • next marked pull loads after combat'),
              ('MDTPM1 submitted  ->  wait ~4 sec  ->  MDTPM2', 'Marker macro 1 applied  ->  wait ~4 sec  ->  marker macro 2'),
              ('Markers submitted - waiting for combat to end before loading the next MDT pull.', 'Markers applied - waiting for combat to end before loading the next MDT pull.'),
          ], 6)

          p = Path('Runtime/MarkerExecutor.lua'); text = p.read_text(encoding='utf-8')
          anchor = 'local function markerOwnerAllowsExecution() local owner, reason, ownerName = Addon.MarkerOwnership:IsOwner() if owner then return true, reason, ownerName end return false, reason or "marker-owner-passive", ownerName end\n'
          if anchor not in text: raise SystemExit('MarkerExecutor owner anchor missing')
          helper = anchor + '''local function validateRuntimeExecutionContext(runtimeState)\n  if executionInvalidated then return nil, executionInvalidationReason or "execution-invalidated" end\n  if not runtimeState or runtimeState.planStatus == "blocked" then return nil, "plan-blocked" end\n  local session = Addon.DungeonSession:GetState(); if not session then return nil, "dungeon-session-unavailable" end\n  if session.challengeCompleted then return nil, "challenge-completed" end\n  if not liveDungeonActive() or not session.active then return nil, "outside-dungeon" end\n  if session.routeMatches == false then return nil, "route-instance-mismatch" end\n  if session.routeMatches ~= true then return nil, "route-instance-unverified" end\n  local ownerAllowed, ownerError = markerOwnerAllowsExecution(); if not ownerAllowed then return nil, ownerError end\n  return session\nend\n'''
          text = text.replace(anchor, helper, 1)
          instruction = '''  if executionInvalidated then return nil, executionInvalidationReason or "execution-invalidated" end\n  local runtimeState = Addon.RuntimeController:GetState(); if not runtimeState or runtimeState.planStatus == "blocked" then return nil, "plan-blocked" end\n  local session = Addon.DungeonSession:GetState(); if not session then return nil, "dungeon-session-unavailable" end\n  if session.challengeCompleted then return nil, "challenge-completed" end\n  if not liveDungeonActive() or not session.active then return nil, "outside-dungeon" end\n  if session.routeMatches == false then return nil, "route-instance-mismatch" end\n  if session.routeMatches ~= true then return nil, "route-instance-unverified" end\n  local ownerAllowed, ownerError = markerOwnerAllowsExecution(); if not ownerAllowed then return nil, ownerError end\n'''
          bulk = '''  if executionInvalidated then return nil, executionInvalidationReason or "execution-invalidated" end\n  batchIndex = tonumber(batchIndex) or 1; if batchIndex < 1 or batchIndex > MAX_ROUTE_BATCHES then return nil, "bulk-batch-invalid" end\n  if not Addon.RuntimeController or type(Addon.RuntimeController.GetState) ~= "function" or type(Addon.RuntimeController.GetOrderedAssignments) ~= "function" then return nil, "runtime-unavailable" end\n  local runtimeState = Addon.RuntimeController:GetState(); if not runtimeState or runtimeState.planStatus == "blocked" then return nil, "plan-blocked" end\n  local session = Addon.DungeonSession:GetState(); if not session then return nil, "dungeon-session-unavailable" end\n  if session.challengeCompleted then return nil, "challenge-completed" end\n  if not liveDungeonActive() or not session.active then return nil, "outside-dungeon" end\n  if session.routeMatches == false then return nil, "route-instance-mismatch" end; if session.routeMatches ~= true then return nil, "route-instance-unverified" end\n  local ownerAllowed, ownerError = markerOwnerAllowsExecution(); if not ownerAllowed then return nil, ownerError end\n'''
          if instruction not in text: raise SystemExit('single execution gate block missing')
          text = text.replace(instruction, '''  local runtimeState = Addon.RuntimeController:GetState()\n  local session, contextError = validateRuntimeExecutionContext(runtimeState); if not session then return nil, contextError end\n''', 1)
          if bulk not in text: raise SystemExit('bulk execution gate block missing')
          text = text.replace(bulk, '''  batchIndex = tonumber(batchIndex) or 1; if batchIndex < 1 or batchIndex > MAX_ROUTE_BATCHES then return nil, "bulk-batch-invalid" end\n  if not Addon.RuntimeController or type(Addon.RuntimeController.GetState) ~= "function" or type(Addon.RuntimeController.GetOrderedAssignments) ~= "function" then return nil, "runtime-unavailable" end\n  local runtimeState = Addon.RuntimeController:GetState()\n  local session, contextError = validateRuntimeExecutionContext(runtimeState); if not session then return nil, contextError end\n''', 1)
          p.write_text(text, encoding='utf-8')

          p = Path('Runtime/RuntimeController.lua'); text = p.read_text(encoding='utf-8')
          sig = '  local markerPlanChanged = state.activePlanSignature and state.activePlanSignature ~= nextPlanSignature\n'
          if sig not in text: raise SystemExit('RuntimeController signature anchor missing')
          text = text.replace(sig, sig + '  local previousRouteMacroPlan = state.routeMacroPlan\n', 1)
          old = '''  state.routeMacroPlan = nil\n  state.lastRouteMacroError = nil\n  if plan.status ~= "blocked" and Addon.RouteMacroPlan and type(Addon.RouteMacroPlan.Build) == "function" then\n    local routeMacroPlan, routeMacroError = Addon.RouteMacroPlan.Build(plan)\n    state.routeMacroPlan, state.lastRouteMacroError = routeMacroPlan, routeMacroError\n  elseif plan.status == "blocked" then state.lastRouteMacroError = "marker-plan-blocked"\n  else state.lastRouteMacroError = "route-macro-planner-unavailable" end\n'''
          if old not in text: raise SystemExit('RuntimeController route macro build anchor missing')
          new = '''  state.routeMacroPlan = nil\n  state.lastRouteMacroError = nil\n  if plan.status ~= "blocked" and Addon.RouteMacroPlan and type(Addon.RouteMacroPlan.Build) == "function" then\n    if not routeChanged and not markerPlanChanged and previousRouteMacroPlan then\n      state.routeMacroPlan = previousRouteMacroPlan\n    else\n      local routeMacroPlan, routeMacroError = Addon.RouteMacroPlan.Build(plan)\n      state.routeMacroPlan, state.lastRouteMacroError = routeMacroPlan, routeMacroError\n    end\n  elseif plan.status == "blocked" then state.lastRouteMacroError = "marker-plan-blocked"\n  else state.lastRouteMacroError = "route-macro-planner-unavailable" end\n'''
          text = text.replace(old, new, 1); p.write_text(text, encoding='utf-8')
          PY
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Validate
        run: lua5.1 tests/run.lua
      - name: Commit implementation
        run: |
          git config user.name 'OpenAI Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Locale/enUS.lua UI/ConfigurationUI.lua UI/RuntimeFrame.lua Runtime/MarkerExecutor.lua Runtime/RuntimeController.lua
          git diff --cached --check
          git commit -m 'Polish existing frontend and backend behavior'
          git push origin HEAD:agent/frontend-backend-polish
